name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use the fixed signing key (so new builds install over old ones)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Generate Android project, analyze and build
        id: build
        run: |
          set -o pipefail
          {
            echo "== flutter --version"; flutter --version
            echo "== flutter create"; flutter create --project-name throw_lab --org com.bramdad --platforms android .
            rm -f test/widget_test.dart
            echo "== patch android"; python3 ci/patch_android.py
            echo "== pub get"; flutter pub get
            echo "== analyze"; flutter analyze --no-fatal-infos --no-fatal-warnings lib || true
            echo "== build"; flutter build apk --release --build-number=${{ github.run_number }}
          } 2>&1 | tee build.log

      - name: Publish APK as a release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ThrowLab-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" "ThrowLab-build-${{ github.run_number }}.apk" \
            --title "Throw Lab build ${{ github.run_number }}" \
            --notes "Tap the .apk below to download it, then open it to install. Commit ${{ github.sha }}." --latest

      - name: Save build log to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp build.log /tmp/cilog/ 2>/dev/null || echo "no log" > /tmp/cilog/build.log
          echo "run=${{ github.run_number }} outcome=${{ steps.build.outcome }} sha=${{ github.sha }}" > /tmp/cilog/status.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . -q
          cp /tmp/cilog/build.log /tmp/cilog/status.txt .
          git add -f build.log status.txt
          git commit -q -m "CI log for run ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
